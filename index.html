<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salt'n Pepper Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <header class="navbar">

        <div class="navbar-container">

            <!-- Logo -->
            <div class="logo">
               <img class="logo-img" src="assets/logo.webp" alt="logo">
            </div>


            <!-- Navigation -->
            <nav class="nav-menu">

                <a href="#">Home</a>

                <a href="#">About Us</a>

                <a href="#">Publications</a>

                <a href="#" class="franchise-btn">
                    Get a Franchise
                </a>

                <a href="#" class="order-btn">
                    Order Online
                    <span class="arrow">→</span>
                </a>

            </nav>

        </div>

    </header>


    <!-- ================= HERO ================= -->
    <main>

        <section class="hero">
            <img src="https://static.tossdown.com/images/fa51cb9a-526f-409c-a8dd-1a30f322fc26.webp" alt="hero-image">
        </section>

    </main>
    <!-- ================= BRANDS SECTION ================= -->

<section class="brands-section">

    <div class="brands-heading">

        <h2>
            Welcome to <span>Salt'n Pepper</span>
            <br>
            Restaurants! Our Brands
        </h2>

        <p>
            Please click our brands below for further information,
            reservations or to order online!
        </p>

    </div>


    <div class="brands-container">

        <!-- Brand 1 -->
        <div class="brand-item">

            <div class="brand-card">
                <img 
                    src="assets/1st img.webp"
                    alt="Salt'n Pepper Restaurant"
                >
            </div>

            <a href="#" class="brand-btn">
                Order Now
            </a>

        </div>


        <!-- Brand 2 -->
        <div class="brand-item">

            <div class="brand-card">
                <img 
                    src="assets/2nd img.webp"
                    alt="Salt'n Pepper Express"
                >
            </div>

            <a href="#" class="brand-btn">
                Order Now
            </a>

        </div>


        <!-- Brand 3 -->
        <div class="brand-item">

            <div class="brand-card">
                <img 
                    src="assets/3rd img.webp"
                    alt="Salt'n Pepper Village"
                >
            </div>

            <a href="#" class="brand-btn">
                Reserve a Table
            </a>

        </div>


        <!-- Brand 4 -->
        <div class="brand-item">

            <div class="brand-card">
                <img 
                    src="assets/4th img.webp"
                    alt="Salt'n Pepper Restaurant"
                >
            </div>

            <a href="#" class="brand-btn">
                Order Now
            </a>

        </div>

    </div>

</section>
</body>
</html>
<!-- tailwind -->
